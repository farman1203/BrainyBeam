<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        //Outer loop 1 baar chalega → inner loop apna poora cycle complete karega.
        for (let i = 1; i <= 3; i++) {
            for (let j = 1; j <= 3; j++) {
                console.log(i, j);
            }
        }

        // 5 or 6 ke table ko ek sath chalana
        for (let i = 5; i <= 6; i++) {
            for (let j = 1; j <= 10; j++) {
                console.log(`${i} x ${j} = ${i * j}`);

            }
        }

        
        for (let i = 1; i <= 3; i++) {
            for (let j = 1; j <= 2; j++) {
                console.log("Hello");
            }
        }
    </script>
</body>

</html>
