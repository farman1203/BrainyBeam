<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //basic 
        var a = 2;
        if (a % 2 === 0) {
            console.log('even');
        }
        else {
            console.log('odd');
        }

        //print 1 to 10 even number
        let arr = []
        for (let i = 0; i < 10; i++) {
            if (i % 2 == 0) {
                arr.push(i)
            }
        }
        console.log(arr);

        //print 1 to 10 odd number
        let arr1 = []
        for (let a = 0; a <= 10; a++) {
            if (a % 2 !== 0) {
                arr1.push(a)
            }
        }
        console.log(arr1);



    </script>
</body>

</html>
