<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // sum of array
        let arr = [10, 20, 30, 40, 50]
        let sum = 0

        for (let i = 0; i < arr.length; i++) {
            sum = sum + arr[i]
        }
        console.log(sum);


        //sum in forEach method
        let a = [10, 20, 30]
        let sum1 = 0
        a.forEach((ele) => {
            sum1 = sum1 + ele
        })
        console.log(sum1);

    </script>
</body>

</html>
